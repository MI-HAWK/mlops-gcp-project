name: CD - Production Deployment

on:
  push:
    branches:
      - main

env:
  ENV: prod
  PROJECT_ID: ${{ secrets.GCP_PROJECT }}
  REGION: us-central1
  CLUSTER: prod-gke-cluster
  IMAGE_NAME: flight-pricing-api

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      # ----------------------------------------------------------------
      # Step 1: Setup + Auth
      # ----------------------------------------------------------------
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Authenticate GCP
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ----------------------------------------------------------------
      # Step 2: Build Docker Image
      # ----------------------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build -f infra/docker/Dockerfile \
            --build-arg ENV=prod \
            -t us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/$IMAGE_NAME:${{ github.sha }} \
            -t us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/$IMAGE_NAME:prod-latest \
            .

      # ----------------------------------------------------------------
      # Step 3: Container Smoke Tests
      # ----------------------------------------------------------------
      - name: Container smoke tests
        run: |
          docker run -d --name smoke-test \
            -p 8080:8080 \
            -e ENV=prod \
            -e MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }} \
            us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/$IMAGE_NAME:${{ github.sha }}

          echo "Waiting for container to be ready (model + encoders must load)..."
          for i in $(seq 1 24); do
            READY=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ready || echo "000")
            if [ "$READY" = "200" ]; then
              echo "Container ready after $((i * 5))s"
              break
            fi
            echo "Attempt $i/24: /ready=$READY — waiting 5s..."
            if [ "$i" = "24" ]; then
              echo "Container model not ready within 120s"
              docker logs smoke-test
              docker stop smoke-test && docker rm smoke-test
              exit 1
            fi
            sleep 5
          done

          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          if [ "$HEALTH" != "200" ]; then
            echo "Health check failed (HTTP $HEALTH)"
            docker logs smoke-test
            exit 1
          fi
          echo "Container smoke test passed"

          docker stop smoke-test && docker rm smoke-test

      # ----------------------------------------------------------------
      # Step 4: Push to Artifact Registry
      # ----------------------------------------------------------------
      - name: Push to Artifact Registry
        run: |
          docker push us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/$IMAGE_NAME:${{ github.sha }}
          docker push us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/$IMAGE_NAME:prod-latest

      # ----------------------------------------------------------------
      # Step 5: Deploy to GKE Prod
      # ----------------------------------------------------------------
      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}-a

      - name: Upsert MLflow ConfigMap
        run: |
          kubectl create configmap mlflow-config \
            --from-literal=MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Prod Cluster
        run: |
          sed -i "s|<IMAGE>|us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/$IMAGE_NAME:${{ github.sha }}|g" infra/k8s/prod/deployment.yaml
          kubectl apply -f infra/k8s/prod/deployment.yaml
          kubectl apply -f infra/k8s/prod/service.yaml
          kubectl apply -f infra/k8s/prod/ingress.yaml
          kubectl apply -f infra/k8s/prod/hpa.yaml
          kubectl rollout status deployment/ml-api-prod --timeout=180s

      # ----------------------------------------------------------------
      # Step 6: Post-deployment Validation
      # ----------------------------------------------------------------
      - name: Post-deployment validation
        run: |
          echo "Waiting for prod service to be ready..."
          sleep 30

          PROD_IP=$(kubectl get svc ml-api-prod-svc -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          if [ -n "$PROD_IP" ]; then
            echo "Prod IP: $PROD_IP"
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://$PROD_IP/health || echo "000")
            echo "Health check: HTTP $HEALTH"
            PRED=$(curl -s -X POST http://$PROD_IP/predict \
              -H "Content-Type: application/json" \
              -d '{"airline":"Vistara","source_city":"Delhi","departure_time":"Morning","stops":"one","arrival_time":"Afternoon","destination_city":"Mumbai","class_type":"Business","duration":5.5,"days_left":15}' || echo "{}")
            echo "Prediction response: $PRED"
          else
            echo "Could not get prod IP — LoadBalancer may still be provisioning"
          fi

          echo "Production deployment complete"
