name: Model Promotion (Manual Approval)

on:
  workflow_dispatch:
    inputs:
      winner:
        description: 'Which model won? (champion or challenger)'
        required: true
        default: 'challenger'
        type: choice
        options:
          - champion
          - challenger
      model_version:
        description: 'MLflow model version to promote (leave empty for latest)'
        required: false
        type: string
      traffic_weight:
        description: 'Traffic weight for winner (100 for full cutover)'
        required: true
        default: '100'
        type: string

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT }}
  REGION: us-central1
  CLUSTER: prod-gke-cluster
  IMAGE_NAME: flight-pricing-api

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: 'write'
      id-token: 'write'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Authenticate GCP
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud + kubectl
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ----------------------------------------------------------------
      # Step 1: Promote in MLflow
      # ----------------------------------------------------------------
      - name: Promote model in MLflow Registry
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python -c "
          from src.utils.promote import swap_champion, get_latest_version
          model_name = 'flight-pricing-model-prod'
          version = '${{ github.event.inputs.model_version }}' or get_latest_version(model_name)
          if '${{ github.event.inputs.winner }}' == 'challenger':
              result = swap_champion(model_name, version)
              print(f'Promoted challenger v{version} to champion')
          else:
              print('Champion retained — no model change needed')
          "

      # ----------------------------------------------------------------
      # Step 2: Update Traffic Routing
      # ----------------------------------------------------------------
      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}-a

      - name: Update traffic weights
        run: |
          WINNER="${{ github.event.inputs.winner }}"
          WEIGHT="${{ github.event.inputs.traffic_weight }}"
          LOSER_WEIGHT=$((100 - WEIGHT))

          if [ "$WINNER" = "challenger" ]; then
            CHAMPION_WEIGHT=$LOSER_WEIGHT
            CHALLENGER_WEIGHT=$WEIGHT
          else
            CHAMPION_WEIGHT=$WEIGHT
            CHALLENGER_WEIGHT=$LOSER_WEIGHT
          fi

          echo "Routing: champion=$CHAMPION_WEIGHT%, challenger=$CHALLENGER_WEIGHT%"

          # Update the ConfigMap
          kubectl create configmap traffic-split-config \
            --from-literal=CHAMPION_WEIGHT=$CHAMPION_WEIGHT \
            --from-literal=CHALLENGER_WEIGHT=$CHALLENGER_WEIGHT \
            --dry-run=client -o yaml | kubectl apply -f -

          # Restart traffic splitter to pick up new config
          kubectl rollout restart deployment/traffic-splitter

          # If 100% to winner, scale down loser
          if [ "$WEIGHT" = "100" ]; then
            if [ "$WINNER" = "challenger" ]; then
              echo "Scaling down old champion..."
              kubectl scale deployment/ml-api-champion --replicas=0

              # Re-tag challenger digest as champion-latest (no image pull needed)
              CHALL_IMAGE=$(kubectl get deployment ml-api-challenger -o jsonpath='{.spec.template.spec.containers[0].image}')
              gcloud artifacts docker tags add \
                "$CHALL_IMAGE" \
                us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/$IMAGE_NAME:champion-latest
            else
              echo "Scaling down challenger..."
              kubectl scale deployment/ml-api-challenger --replicas=0
            fi
          fi

      - name: Post promotion summary
        run: |
          echo "## 🏆 Model Promotion Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Winner**: ${{ github.event.inputs.winner }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Model Version**: ${{ github.event.inputs.model_version || 'latest' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Traffic Weight**: ${{ github.event.inputs.traffic_weight }}%" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
