name: CI - Feature Branch Validation

on:
  push:
    branches-ignore:
      - main
      - develop
  pull_request:
    branches:
      - develop

env:
  ENV: dev

jobs:
  train-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install -g @dvcorg/cml

      - name: Authenticate GCP
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: DVC Pull (DEV data)
        run: |
          dvc remote add -d -f dev-gcs gs://${{ secrets.GCP_PROJECT }}-mlops-dev-data
          dvc pull data/dev_train.csv.dvc data/dev_test.csv.dvc

      - name: Train model and generate metrics
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          dvc repro dvc.yaml

      - name: Create CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Model Evaluation Report - Dev Environment" > report.md
          cat metrics.txt >> report.md
          cml comment create report.md
