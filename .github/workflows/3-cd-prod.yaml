name: CD - Production Deployment

on:
  push:
    branches:
      - main

env:
  ENV: prod
  PROJECT_ID: ${{ secrets.GCP_PROJECT }}
  REGION: us-central1
  CLUSTER: prod-gke-cluster
  IMAGE_NAME: flight-pricing-api

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Authenticate GCP
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model and register to MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          dvc remote add -d -f prod-gcs gs://${{ secrets.GCP_PROJECT }}-mlops-prod-data
          dvc pull data/prod_train.csv.dvc data/prod_test.csv.dvc
          python src/model/train.py

      - name: Build Docker Image
        run: docker build -f infra/docker/Dockerfile -t us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/$IMAGE_NAME:${{ github.sha }} .

      - name: Push to Artifact Registry
        run: docker push us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/$IMAGE_NAME:${{ github.sha }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}-a

      - name: Deploy to Prod Cluster
        run: |
          sed -i "s|<IMAGE>|us-central1-docker.pkg.dev/$PROJECT_ID/ml-repo/$IMAGE_NAME:${{ github.sha }}|g" infra/k8s/prod/deployment.yaml
          kubectl apply -f infra/k8s/prod/deployment.yaml
          kubectl apply -f infra/k8s/prod/service.yaml
          kubectl apply -f infra/k8s/prod/ingress.yaml
