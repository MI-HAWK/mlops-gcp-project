stages:
  train:
    cmd: python src/utils/prepare_feast.py && cd feast_repo && feast apply && cd .. && python src/model/train.py
    deps:
      - src/model/train.py
      - src/utils/config.py
      - data/dev_train.csv
      - data/dev_test.csv
      - feast_repo/features.py
    metrics:
      - metrics.txt:
          cache: false
    outs:
      - models/encoders.joblib:
          cache: false
