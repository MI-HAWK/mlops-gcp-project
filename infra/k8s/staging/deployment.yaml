apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-api-staging
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-api-staging
  template:
    metadata:
      labels:
        app: ml-api-staging
    spec:
      containers:
      - name: api
        image: <IMAGE>
        ports:
        - containerPort: 8080
        env:
        - name: ENV
          value: "staging"
        - name: MLFLOW_TRACKING_URI
          value: "<MLFLOW_URI>"
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1.5Gi"
            cpu: "500m"
