# NGINX-based traffic splitter for champion-challenger A/B routing
# Configurable weights via ConfigMap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-split-config
  namespace: default
data:
  CHAMPION_WEIGHT: "50"
  CHALLENGER_WEIGHT: "50"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-splitter-config
  namespace: default
data:
  nginx.conf: |
    upstream champion {
        server ml-api-champion-svc.default.svc.cluster.local:80;
    }
    upstream challenger {
        server ml-api-challenger-svc.default.svc.cluster.local:80;
    }

    # Use split_clients to route traffic by weight.
    # $request_id provides per-request randomness.
    split_clients "$request_id" $backend {
        50% champion;
        *    challenger;
    }

    server {
        listen 8080;

        location /health {
            # Always route health checks to champion for Ingress health checks
            proxy_pass http://champion;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://$backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Model-Backend $backend;

            # Add response header to identify which model served the request
            add_header X-Served-By $backend always;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-splitter
  namespace: default
  labels:
    app: traffic-splitter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traffic-splitter
  template:
    metadata:
      labels:
        app: traffic-splitter
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-splitter-config
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-splitter-svc
  namespace: default
spec:
  selector:
    app: traffic-splitter
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
