apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-api-prod
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-api-prod
  template:
    metadata:
      labels:
        app: ml-api-prod
    spec:
      containers:
      - name: api
        image: <IMAGE>
        ports:
        - containerPort: 8080
        env:
        - name: ENV
          value: "prod"
        - name: MLFLOW_TRACKING_URI
          valueFrom:
            configMapKeyRef:
              name: mlflow-config
              key: MLFLOW_TRACKING_URI
              optional: true
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "500m"
