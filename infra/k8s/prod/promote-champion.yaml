# Promotion patch — route 100% traffic to new champion after manual approval
# Apply this AFTER running the 5-promote-model.yaml workflow
#
# Usage:
#   kubectl apply -f promote-champion.yaml
#   kubectl rollout restart deployment/traffic-splitter
#
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-split-config
  namespace: default
data:
  CHAMPION_WEIGHT: "100"
  CHALLENGER_WEIGHT: "0"
---
# Update the nginx config to route 100% to champion
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-splitter-config
  namespace: default
data:
  nginx.conf: |
    upstream champion {
        server ml-api-champion-svc.default.svc.cluster.local:80;
    }
    upstream challenger {
        server ml-api-challenger-svc.default.svc.cluster.local:80;
    }

    # 100% to champion after promotion
    split_clients "$request_id" $backend {
        100% champion;
        *    challenger;
    }

    server {
        listen 8080;

        location /health {
            proxy_pass http://champion;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://$backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header X-Served-By $backend always;
        }
    }
