# Production Ingress — routes to traffic-splitter for champion-challenger A/B testing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-pricing-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "gce"
    # Health check path for GCE Ingress
    cloud.google.com/backend-config: '{"default": "ml-api-backend-config"}'
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: traffic-splitter-svc
            port:
              number: 80
---
# BackendConfig for GCE health checks
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: ml-api-backend-config
  namespace: default
spec:
  healthCheck:
    requestPath: /health
    port: 8080
    type: HTTP
